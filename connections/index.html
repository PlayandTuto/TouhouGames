<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touhou Connections</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("tmrTheme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{--bg:#f4ecea;--fg:#222;--card:#fff;--ac:#c0392b;--mut:#777}
:root[data-theme="dark"]{--bg:#16121a;--fg:#eee;--card:#241d2b;--mut:#999}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border-radius:10px;padding:8px 12px}
h1{font-size:20px;margin:0}.bar{display:flex;gap:6px}.m{color:var(--mut)}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 12px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--mut)}
.box{background:var(--card);border-radius:10px;padding:32px 16px;margin-top:12px;text-align:center}
.box .ico{font-size:48px}
</style></head><body><main>
<header><h1>Touhou Connections</h1>
<div class="bar"><a class="btn ghost" href="../" data-i="hub"></a><button id="thm" class="ghost"></button><button id="lng" class="ghost"></button></div></header>
<div class="box"><div class="ico">🧩</div><h2 data-i="t"></h2><p class="m" data-i="d"></p></div>
<script>
const I18N={pl:{hub:"← Gry",t:"Już wkrótce",d:"Ta gra jest w budowie."},en:{hub:"← Games",t:"Coming soon",d:"This game is under construction."}};
const $=id=>document.getElementById(id);
let lang=(navigator.language||"").toLowerCase().startsWith("pl")?"pl":"en";try{const sl=localStorage.getItem("tmrLang");if(sl)lang=sl}catch(e){}
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=I18N[lang][e.dataset.i]);$("lng").textContent=lang==="pl"?"EN":"PL"}
$("lng").onclick=()=>{lang=lang==="pl"?"en":"pl";try{localStorage.setItem("tmrLang",lang)}catch(e){}applyLang()};
function setTheme(x){document.documentElement.dataset.theme=x;$("thm").textContent=x==="dark"?"☀️":"🌙";try{localStorage.setItem("tmrTheme",x)}catch(e){}}
$("thm").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
setTheme(document.documentElement.dataset.theme);applyLang();
</script></main></body></html>
