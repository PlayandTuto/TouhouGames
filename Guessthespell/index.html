<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Spell · Touhou Games</title>
<style>
  :root {
    --bg: #f6f2ec; --fg: #1e1b24; --muted: #6d6774; --card: #ffffff; --line: #ddd5ca;
    --ok: #2f9a5a; --bad: #c74343; --part: #d29a00; --accent: #b3122e;
  }
  [data-theme="dark"] {
    --bg: #15131a; --fg: #ece8f3; --muted: #9b95a7; --card: #211e28; --line: #39333f;
    --ok: #3cbc72; --bad: #e05b5b; --part: #e7b42c; --accent: #ff5b70;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px; padding: 6px 12px; }
  button:disabled { opacity: .45; cursor: default; }

  .top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .top .home { margin-right: auto; color: var(--fg); text-decoration: none; font-weight: 600; }

  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { text-align: center; margin: 6px 0 4px; font-size: 1.9rem; letter-spacing: .5px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 16px; font-size: .92rem; }

  .seg { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .seg button.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .seg .d-easy.active { background: #3a9160; border-color: #3a9160; color: #fff; }
  .seg .d-normal.active { background: #3567b5; border-color: #3567b5; color: #fff; }
  .seg .d-hard.active { background: #c77a12; border-color: #c77a12; color: #fff; }
  .seg .d-lunatic.active { background: #8e2bb3; border-color: #8e2bb3; color: #fff; }
  .diffnote { text-align: center; color: var(--muted); font-size: .85rem; min-height: 1.2em; margin-bottom: 12px; }

  .frame { position: relative; width: 100%; max-width: 440px; margin: 0 auto; overflow: hidden; border-radius: 12px; background: #000; border: 1px solid var(--line); aspect-ratio: 6 / 7; }
  .frame.flip { transform: scaleX(-1); }
  .frame canvas { display: block; width: 100%; height: 100%; transition: transform .7s ease, filter .4s ease; user-select: none; -webkit-user-drag: none; }
  .frame.gray canvas { filter: grayscale(1); }
  .frame.noanim canvas { transition: none; }
  .frame .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; }

  .pips { display: flex; justify-content: center; gap: 6px; margin: 12px 0; }
  .pip { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .pip.bad { background: var(--bad); } .pip.part { background: var(--part); } .pip.ok { background: var(--ok); }

  .guessbox { position: relative; display: flex; gap: 6px; }
  .guessbox input { flex: 1; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .sugg { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; list-style: none; margin: 4px 0 0; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; max-height: 290px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .sugg li { padding: 7px 9px; border-radius: 6px; cursor: pointer; }
  .sugg li.sel, .sugg li:hover { background: var(--line); }
  .sugg .meta { display: block; font-size: .8rem; color: var(--muted); }

  .guesses { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
  .guesses li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
  .guesses .gname { flex: 1; }
  .chip { font-size: .75rem; padding: 2px 8px; border-radius: 99px; color: #fff; white-space: nowrap; }
  .chip.y { background: var(--ok); } .chip.n { background: var(--bad); }
  .guesses li.win { border-color: var(--ok); }

  .result { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); text-align: center; }
  .result h2 { margin: 0 0 6px; font-size: 1.2rem; }
  .result .answer { font-weight: 600; font-size: 1.1rem; }
  .result .jp, .result .src { color: var(--muted); font-size: .9rem; }
  .result .actions { margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .stats { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 10px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../" data-i18n="home">← Touhou Games</a>
  <button id="langBtn" title="Język / Language">EN</button>
  <button id="themeBtn" title="Motyw">🌙</button>
</header>

<main>
  <h1>Guess the Spell</h1>
  <p class="sub" data-i18n="subtitle"></p>

  <div class="seg" id="modeSeg">
    <button data-mode="daily" data-i18n="daily"></button>
    <button data-mode="endless" data-i18n="endless"></button>
  </div>
  <div class="seg" id="diffSeg">
    <button class="d-easy" data-diff="easy">Easy</button>
    <button class="d-normal" data-diff="normal">Normal</button>
    <button class="d-hard" data-diff="hard">Hard</button>
    <button class="d-lunatic" data-diff="lunatic">Lunatic</button>
  </div>
  <div class="diffnote" id="diffNote"></div>

  <div class="frame noanim" id="frame">
    <canvas id="cv"></canvas>
    <div class="loading" id="loading">…</div>
  </div>

  <div class="pips" id="pips"></div>

  <div class="guessbox" id="guessBox">
    <input id="input" autocomplete="off" spellcheck="false">
    <button id="skipBtn" data-i18n="skip"></button>
    <ul class="sugg hidden" id="sugg"></ul>
  </div>

  <ul class="guesses" id="guesses"></ul>

  <div class="result hidden" id="result">
    <h2 id="resTitle"></h2>
    <div class="answer" id="resName"></div>
    <div class="jp" id="resJp"></div>
    <div class="src" id="resSrc"></div>
    <div class="actions">
      <button id="shareBtn" data-i18n="share"></button>
      <button id="nextBtn" data-i18n="next"></button>
    </div>
    <div class="stats" id="countdown"></div>
  </div>
  <div class="stats" id="stats"></div>
</main>
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
(() => {
  // ---------- konfiguracja ----------
  const MAX_GUESSES = 5;
  const ZOOMS = [8, 5, 3.2, 2, 1.35];          // przybliżenie przed 1., 2., ... 5. próbą
  const LAUNCH_DAY = Date.UTC(2026, 10, 28);    // dzień #1 trybu codziennego (UTC), miesiące od 0
  const DAY_MS = 86400000;

  const { GAMES, hashStr } = GTS;
  const DIFFS = {
    easy:    { tier: 1, gray: false, flip: false },
    normal:  { tier: 2, gray: false, flip: false },
    hard:    { tier: 3, gray: true,  flip: false },
    lunatic: { tier: 4, gray: true,  flip: true  },
  };

  const T = {
    pl: {
      home: "← Touhou Games", subtitle: "Rozpoznaj spellcard. Każda pomyłka oddala obrazek.",
      daily: "Codzienny", endless: "Nieskończony", skip: "Pomiń",
      placeholder: "Wpisz nazwę spellcarda lub postać…",
      note_easy: "Gry klasyczne (6–9)", note_normal: "Wszystkie gry główne",
      note_hard: "Gry główne + fotograficzne · skala szarości",
      note_lunatic: "Wszystko + bijatyki · skala szarości i odbicie lustrzane",
      game: "Gra", character: "Postać", skipped: "(pominięto)",
      win: "Brawo!", lose: "Nie tym razem", share: "Udostępnij", next: "Następny",
      copied: "Skopiowano wynik!", nextIn: "Następny spellcard za", streak: "Seria", best: "Rekord",
      empty: "Brak spellcardów dla tego poziomu.", tries: "Próba",
    },
    en: {
      home: "← Touhou Games", subtitle: "Guess the spell card. Every miss zooms the image out.",
      daily: "Daily", endless: "Endless", skip: "Skip",
      placeholder: "Type a spell card name or character…",
      note_easy: "Classic games (6–9)", note_normal: "All mainline games",
      note_hard: "Mainline + photo games · grayscale",
      note_lunatic: "Everything + fighting games · grayscale and mirrored",
      game: "Game", character: "Character", skipped: "(skipped)",
      win: "Well done!", lose: "Not this time", share: "Share", next: "Next",
      copied: "Result copied!", nextIn: "Next spell card in", streak: "Streak", best: "Best",
      empty: "No spell cards for this difficulty.", tries: "Try",
    },
  };

  // ---------- localStorage (z zabezpieczeniem) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // język i motyw są wspólne dla całej strony (klucze tmrLang / tmrTheme), tryb i poziom - tylko tej gry
  const raw = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const savedLang = raw.get("tmrLang"), savedTheme = raw.get("tmrTheme");
  const settings = Object.assign(
    { mode: "daily", diff: "normal" },
    store.get("gts-settings", {}),
    {
      lang: savedLang === "pl" || savedLang === "en" ? savedLang : ((navigator.language || "pl").startsWith("pl") ? "pl" : "en"),
      theme: savedTheme === "dark" || savedTheme === "light" ? savedTheme : null,
    }
  );
  const saveSettings = () => {
    store.set("gts-settings", { mode: settings.mode, diff: settings.diff });
    raw.set("tmrLang", settings.lang);
    if (settings.theme) raw.set("tmrTheme", settings.theme);
  };
  const t = k => T[settings.lang][k] ?? k;

  // ---------- losowość deterministyczna ----------
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
  function shuffled(arr, seed) { const a = arr.slice(), r = rng(seed); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const dayIndex = () => Math.max(0, Math.floor((Date.now() - LAUNCH_DAY) / DAY_MS));

  // ---------- dane ----------
  let ALL = [];
  const norm = s => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[「」『』"“”'’]/g, "").trim();
  const keyOf = c => norm(c.name) + "|" + norm(c.character);

  function poolFor(diff) {
    const tier = DIFFS[diff].tier;
    return ALL.filter(c => GAMES[c.game] && GAMES[c.game][1] <= tier).sort((a, b) => a.id < b.id ? -1 : 1);
  }
  // opcje do zgadywania: karty o tej samej nazwie i postaci (np. z różnych gier) łączymy w jedną
  function optionsFor(pool) {
    const m = new Map();
    for (const c of pool) {
      const k = keyOf(c);
      if (!m.has(k)) m.set(k, { key: k, name: c.name, jp: c.jp, character: c.character, games: new Set() });
      m.get(k).games.add(c.game);
    }
    return [...m.values()].sort((a, b) => a.name.localeCompare(b.name));
  }

  // ---------- stan rundy ----------
  let round = null;   // { card, guesses: [key|null], done, won }
  let options = [], optByKey = new Map();

  const $ = id => document.getElementById(id);
  const frame = $("frame"), cv = $("cv"), input = $("input"), sugg = $("sugg");

  function roundKey() {
    return settings.mode === "daily"
      ? `gts-daily-${settings.diff}-${dayIndex()}`
      : `gts-endless-round-${settings.diff}`;
  }
  const endlessStatsKey = () => `gts-endless-${settings.diff}`;

  function startRound() {
    const pool = poolFor(settings.diff);
    options = optionsFor(pool);
    optByKey = new Map(options.map(o => [o.key, o]));
    if (!pool.length) { round = null; render(); return; }

    const saved = store.get(roundKey(), null);
    let card = saved && pool.find(c => c.id === saved.id);

    if (!card && settings.mode === "daily") {
      const order = shuffled(pool, hashStr("daily-" + settings.diff));
      card = order[dayIndex() % order.length];
    }
    if (!card) {
      const st = store.get(endlessStatsKey(), { streak: 0, best: 0, seen: [] });
      let fresh = pool.filter(c => !st.seen.includes(c.id));
      if (!fresh.length) { st.seen = []; fresh = pool; store.set(endlessStatsKey(), st); }
      card = fresh[Math.floor(Math.random() * fresh.length)];
    }
    round = (saved && saved.id === card.id)
      ? { card, guesses: saved.guesses, done: saved.done, won: saved.won }
      : { card, guesses: [], done: false, won: false };
    persist();
    loadImage();
    render();
  }

  function persist() {
    if (round) store.set(roundKey(), { id: round.card.id, guesses: round.guesses, done: round.done, won: round.won });
  }

  let loadToken = 0;
  function loadImage() {
    const token = ++loadToken;
    frame.classList.add("noanim");
    cv.style.visibility = "hidden";
    $("loading").textContent = "…";
    $("loading").classList.remove("hidden");
    const c = round.card;
    cv.style.transformOrigin = `${c.focus[0] * 100}% ${c.focus[1] * 100}%`;
    applyZoom();
    const im = new Image();
    im.onload = () => {
      if (token !== loadToken) return;
      GTS.renderCard(cv, im, GTS.masksFor(c));
      frame.style.aspectRatio = `${im.naturalWidth} / ${im.naturalHeight}`;
      cv.style.visibility = "visible";
      $("loading").classList.add("hidden");
      requestAnimationFrame(() => requestAnimationFrame(() => frame.classList.remove("noanim")));
    };
    im.onerror = () => { if (token === loadToken) $("loading").textContent = "✗ " + c.image; };
    im.src = c.image;
  }

  function applyZoom() {
    const z = round.done ? 1 : ZOOMS[Math.min(round.guesses.length, ZOOMS.length - 1)];
    cv.style.transform = `scale(${z})`;
    const d = DIFFS[settings.diff];
    frame.classList.toggle("gray", d.gray && !round.done);
    frame.classList.toggle("flip", d.flip && !round.done);
  }

  // ---------- zgadywanie ----------
  function guessResult(key) {
    if (key === null) return { ok: false, game: false, char: false };
    const o = optByKey.get(key), c = round.card;
    return {
      ok: key === keyOf(c),
      game: o.games.has(c.game),
      char: norm(o.character) === norm(c.character),
    };
  }

  function submit(key) {
    if (!round || round.done) return;
    if (key !== null && round.guesses.includes(key)) return;
    round.guesses.push(key);
    const r = guessResult(key);
    if (r.ok) { round.done = true; round.won = true; }
    else if (round.guesses.length >= MAX_GUESSES) { round.done = true; }
    if (round.done && settings.mode === "endless") {
      const st = store.get(endlessStatsKey(), { streak: 0, best: 0, seen: [] });
      st.seen.push(round.card.id);
      st.streak = round.won ? st.streak + 1 : 0;
      st.best = Math.max(st.best, st.streak);
      store.set(endlessStatsKey(), st);
    }
    persist();
    input.value = "";
    hideSugg();
    applyZoom();
    render();
  }

  // ---------- podpowiedzi ----------
  let suggItems = [], suggSel = 0;
  function updateSugg() {
    const q = norm(input.value);
    if (!q || !round || round.done) return hideSugg();
    suggItems = options.filter(o =>
      !round.guesses.includes(o.key) &&
      (norm(o.name).includes(q) || norm(o.character).includes(q) || (o.jp && o.jp.includes(input.value.trim())))
    ).slice(0, 10);
    suggSel = 0;
    if (!suggItems.length) return hideSugg();
    sugg.innerHTML = "";
    suggItems.forEach((o, i) => {
      const li = document.createElement("li");
      if (i === suggSel) li.className = "sel";
      li.textContent = o.name;
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = o.character + (o.jp ? " · " + o.jp : "");
      li.appendChild(meta);
      li.addEventListener("mousedown", e => { e.preventDefault(); submit(o.key); });
      sugg.appendChild(li);
    });
    sugg.classList.remove("hidden");
  }
  function hideSugg() { sugg.classList.add("hidden"); suggItems = []; }
  function moveSel(d) {
    if (!suggItems.length) return;
    suggSel = (suggSel + d + suggItems.length) % suggItems.length;
    [...sugg.children].forEach((li, i) => li.classList.toggle("sel", i === suggSel));
    sugg.children[suggSel].scrollIntoView({ block: "nearest" });
  }

  input.addEventListener("input", updateSugg);
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); moveSel(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveSel(-1); }
    else if (e.key === "Enter" && suggItems.length) { e.preventDefault(); submit(suggItems[suggSel].key); }
    else if (e.key === "Escape") hideSugg();
  });
  input.addEventListener("blur", () => setTimeout(hideSugg, 100));
  $("skipBtn").addEventListener("click", () => submit(null));

  // ---------- render ----------
  function squares() {
    return round.guesses.map(k => { const r = guessResult(k); return r.ok ? "🟩" : (r.game || r.char) ? "🟨" : "🟥"; });
  }

  function render() {
    document.documentElement.lang = settings.lang;
    document.documentElement.dataset.theme = settings.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    $("themeBtn").textContent = document.documentElement.dataset.theme === "dark" ? "☀️" : "🌙";
    $("langBtn").textContent = settings.lang === "pl" ? "EN" : "PL";
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    input.placeholder = t("placeholder");
    document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("active", b.dataset.mode === settings.mode));
    document.querySelectorAll("#diffSeg button").forEach(b => b.classList.toggle("active", b.dataset.diff === settings.diff));
    $("diffNote").textContent = t("note_" + settings.diff);

    const guessesEl = $("guesses"), pips = $("pips");
    guessesEl.innerHTML = ""; pips.innerHTML = "";

    if (!round) {
      frame.classList.add("hidden");
      $("guessBox").classList.add("hidden");
      $("result").classList.add("hidden");
      $("stats").textContent = ALL.length ? t("empty") : "";
      return;
    }
    frame.classList.remove("hidden");

    for (let i = 0; i < MAX_GUESSES; i++) {
      const p = document.createElement("div");
      p.className = "pip";
      if (i < round.guesses.length) {
        const r = guessResult(round.guesses[i]);
        p.classList.add(r.ok ? "ok" : (r.game || r.char) ? "part" : "bad");
      }
      pips.appendChild(p);
    }

    round.guesses.forEach(k => {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.className = "gname";
      if (k === null) { name.textContent = t("skipped"); li.appendChild(name); }
      else {
        const o = optByKey.get(k), r = guessResult(k);
        name.textContent = o ? o.name : k;
        li.appendChild(name);
        if (r.ok) li.classList.add("win");
        else {
          for (const [label, yes] of [[t("game"), r.game], [t("character"), r.char]]) {
            const chip = document.createElement("span");
            chip.className = "chip " + (yes ? "y" : "n");
            chip.textContent = (yes ? "✓ " : "✗ ") + label;
            li.appendChild(chip);
          }
        }
      }
      guessesEl.appendChild(li);
    });

    $("guessBox").classList.toggle("hidden", round.done);
    const res = $("result");
    res.classList.toggle("hidden", !round.done);
    if (round.done) {
      const c = round.card;
      $("resTitle").textContent = round.won ? t("win") : t("lose");
      $("resName").textContent = c.name;
      $("resJp").textContent = c.jp || "";
      $("resSrc").textContent = `${c.character} · ${GAMES[c.game] ? GAMES[c.game][0] : c.game}`;
      $("shareBtn").classList.toggle("hidden", settings.mode !== "daily");
      $("nextBtn").classList.toggle("hidden", settings.mode !== "endless");
    }

    if (settings.mode === "endless") {
      const st = store.get(endlessStatsKey(), { streak: 0, best: 0 });
      $("stats").textContent = `${t("streak")}: ${st.streak} · ${t("best")}: ${st.best}`;
    } else {
      $("stats").textContent = "";
    }
    tickCountdown();
  }

  function tickCountdown() {
    const el = $("countdown");
    if (!round || !round.done || settings.mode !== "daily") { el.textContent = ""; return; }
    const next = LAUNCH_DAY + (dayIndex() + 1) * DAY_MS;
    let s = Math.max(0, Math.floor((next - Date.now()) / 1000));
    if (s === 0) { startRound(); return; }
    const hh = String(Math.floor(s / 3600)).padStart(2, "0");
    const mm = String(Math.floor(s % 3600 / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    el.textContent = `${t("nextIn")} ${hh}:${mm}:${ss}`;
  }
  setInterval(tickCountdown, 1000);

  // ---------- przyciski ----------
  $("shareBtn").addEventListener("click", async () => {
    const sq = squares();
    while (sq.length < MAX_GUESSES && !round.won) sq.push("⬛");
    const diffName = settings.diff[0].toUpperCase() + settings.diff.slice(1);
    const text = `Guess the Spell #${dayIndex() + 1} · ${diffName} · ${round.won ? round.guesses.length : "X"}/${MAX_GUESSES}\n${sq.join("")}\n${location.href.split("?")[0].split("#")[0]}`;
    try { await navigator.clipboard.writeText(text); toast(t("copied")); }
    catch { prompt("", text); }
  });
  $("nextBtn").addEventListener("click", () => { store.set(roundKey(), null); startRound(); });

  document.querySelectorAll("#modeSeg button").forEach(b => b.addEventListener("click", () => {
    settings.mode = b.dataset.mode; saveSettings(); startRound();
  }));
  document.querySelectorAll("#diffSeg button").forEach(b => b.addEventListener("click", () => {
    settings.diff = b.dataset.diff; saveSettings(); startRound();
  }));
  $("langBtn").addEventListener("click", () => { settings.lang = settings.lang === "pl" ? "en" : "pl"; saveSettings(); render(); });
  $("themeBtn").addEventListener("click", () => {
    settings.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; saveSettings(); render();
  });

  function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1600); }

  // ---------- start ----------
  render();
  fetch("spellcards.json", { cache: "no-cache" })
    .then(r => r.json())
    .then(data => { ALL = data.map(c => ({ ...c, id: GTS.cardId(c), focus: c.focus || [0.5, 0.5] })); startRound(); })
    .catch(() => { $("loading").textContent = "spellcards.json ?"; });
})();
</script>
</body>
</html>
